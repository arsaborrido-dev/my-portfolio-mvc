
name: MVC CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MVC
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore my-portfolio-mvc/my-portfolio-mvc.csproj

      - name: Build
        run: dotnet build my-portfolio-mvc/my-portfolio-mvc.csproj --configuration Release --no-restore
